<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f1efe9" />
    <script>
      // Set the theme before first paint (no flash). Mirrors resolveTheme() in src/app/theme.ts.
      try {
        var c = localStorage.getItem('kaizen.theme'), h = new Date().getHours()
        document.documentElement.dataset.theme =
          c === 'morning' || c === 'day' || c === 'evening' ? c : h < 11 ? 'morning' : h < 17 ? 'day' : 'evening'
      } catch (e) {}
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Kaizen" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/kaizen/favicon.svg" />
    <link rel="apple-touch-icon" href="/kaizen/apple-touch-icon-180x180.png" />
    <title>Kaizen</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
